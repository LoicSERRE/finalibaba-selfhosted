name: Publish Docker images

on:
  release:
    types: [published]
  # Validates changes to this file and the two Dockerfiles before they ever
  # reach a release - added after v1.4.4's release pipeline built and pushed
  # both images successfully, then silently never deployed because
  # aquasecurity/trivy-action was pinned to a tag (`0.36.0`) that doesn't
  # exist (the real tag is `v0.36.0`). No PR check exercised that line -
  # ci.yml never touches Docker at all, and this file only ran on `release`.
  # The validate-docker-* jobs below reuse the exact same actions
  # (docker/build-push-action, aquasecurity/trivy-action) so a broken action
  # reference or a Dockerfile that fails to build now fails on the PR,
  # instead of silently succeeding at build-app/build-sync and only
  # surfacing at trivy-scan on release day - by which point the images are
  # already sitting in GHCR with nothing having reached prod/demo.
  pull_request:
    paths:
      - ".github/workflows/docker.yml"
      - "Dockerfile"
      - "sync/Dockerfile"

env:
  REGISTRY: ghcr.io

jobs:
  # Publishing an image is not gated on ci.yml having passed - that workflow
  # only runs on push/PR to main, and a release can be published from any
  # commit regardless of what CI said about it. This job re-runs the tests
  # here, as part of the actual publish path, so build-app/build-sync below
  # (and therefore notify-deploy, which only runs after both) are hard-blocked
  # if a test fails - no release ever reaches the private deploy pipeline
  # without a green test run against that exact commit.
  test:
    name: Unit tests
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # No cache: pnpm here (unlike ci.yml's own setup-node steps), and
      # package-manager-cache explicitly disabled (it defaults to true and
      # auto-detects pnpm from package.json's "packageManager" field even
      # without the cache: input set) - this job only ever runs on
      # `release`, a one-shot event with nothing to amortize a warm cache
      # against, and zizmor's cache-poisoning audit flags any caching
      # action in a release-triggered job on general principle (a
      # PR-triggered run elsewhere could poison a cache that a privileged
      # release run later restores). Disabling both caching inputs is
      # simpler and more certain than reasoning about whether pnpm's
      # content-addressable store would have actually been exploitable here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm test

  # Same reasoning as `test` above, applied to the sync/ image specifically -
  # build-sync used to depend only on the JS test suite, so a broken Python
  # sync/ commit could still publish a new sync image with nothing to stop it.
  python-check:
    name: Python lint, tests & audit (sync service)
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.0
      - run: ruff check sync/
      - run: pip install pip-audit
      - run: pip-audit -r sync/requirements.txt
      - run: pip install -r sync/requirements.txt -r sync/requirements-dev.txt
      - run: cd sync && python -m pytest

  # linux/arm64 used to be built via QEMU emulation on an amd64 runner, but
  # that turned out to be unreliable for this image's mix of native/WASM
  # dependencies - confirmed with two different failure modes on the same
  # v1.5.1 release build in a row: the runner's baked-in QEMU first crashed
  # outright on @tailwindcss/oxide-wasm32-wasi ("uncaught target signal 4",
  # then hung for 67+ minutes instead of failing), and after pinning a
  # newer QEMU (tonistiigi/binfmt) fixed that, Prisma's schema-engine WASM
  # binary then produced silently *corrupted* JSON output under the same
  # emulation instead of crashing. Two distinct emulation bugs on two
  # different native deps in a row means QEMU itself isn't trustworthy here,
  # not that any one package needed a workaround - so each platform now
  # builds natively on its own real architecture instead (ubuntu-24.04-arm
  # is a GitHub-hosted native arm64 runner, free for public repos), and the
  # two single-arch images are combined into one multi-arch manifest by the
  # merge-app/merge-sync jobs below. See Docker's own "multi-platform image
  # with digests" pattern - this is that pattern, not a bespoke one.
  build-app:
    name: Build & push app image (${{ matrix.platform }})
    if: github.event_name == 'release'
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR paths must be all-lowercase - this repo's real GitHub owner
      # login is "LoicSERRE" (capitalized), so a raw ${{ github.repository }}
      # interpolation would break the push. Same fix as trivy-scan below.
      - name: Lowercase repository path
        id: repo
        run: echo "path=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.path }}/app

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.repo.outputs.path }}/app,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.platform }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Slugify platform for artifact name
        id: slug
        run: echo "slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-app-${{ steps.slug.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-app:
    name: Merge app image manifest
    if: github.event_name == 'release'
    needs: [build-app]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Exposes the exact multi-arch manifest digest just pushed so trivy-scan
    # can pull it by digest instead of the mutable `:latest` tag - GHCR's
    # `:latest` pointer can lag briefly behind the manifest it was just
    # repointed to (see the note on trivy-scan below).
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-app-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository path
        id: repo
        run: echo "path=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.path }}/app
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.repo.outputs.path }}/app
        run: |
          # shellcheck disable=SC2046 # word-splitting is the point here: both
          # $(...) below expand to several space-separated CLI args (-t tag1
          # -t tag2, and one image@digest per downloaded platform digest
          # file), not a single string - quoting would break both expansions.
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_REF}@sha256:%s " *)

      - name: Capture manifest digest
        id: merge
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.repo.outputs.path }}/app
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE_REF}:${VERSION}" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  build-sync:
    name: Build & push sync image (${{ matrix.platform }})
    if: github.event_name == 'release'
    needs: [test, python-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository path
        id: repo
        run: echo "path=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.path }}/sync

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./sync
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.repo.outputs.path }}/sync,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=sync-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=sync-${{ matrix.platform }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Slugify platform for artifact name
        id: slug
        run: echo "slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-sync-${{ steps.slug.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-sync:
    name: Merge sync image manifest
    if: github.event_name == 'release'
    needs: [build-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-sync-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository path
        id: repo
        run: echo "path=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.path }}/sync
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.repo.outputs.path }}/sync
        run: |
          # shellcheck disable=SC2046 # word-splitting is the point here: both
          # $(...) below expand to several space-separated CLI args (-t tag1
          # -t tag2, and one image@digest per downloaded platform digest
          # file), not a single string - quoting would break both expansions.
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_REF}@sha256:%s " *)

      - name: Capture manifest digest
        id: merge
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.repo.outputs.path }}/sync
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE_REF}:${VERSION}" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # Scans the images actually published above (registry pull, not a rebuild)
  # for OS-package-level CVEs - npm audit/pip-audit only ever see what's
  # declared in package.json/requirements.txt, never what's baked into the
  # final image's base layer (node:22-alpine, python:3.14-slim + apk/apt
  # packages). Findings go to the Security tab alongside CodeQL; a
  # CRITICAL/HIGH finding on the app image also blocks notify-deploy below,
  # so an unnoticed regression there can't auto-deploy to prod even though
  # the image itself is already sitting in GHCR by this point.
  #
  # sync is scanned non-blocking (exit-code 0) - see the "known accepted
  # risk" note in CLAUDE.md's Backup & restore / Docker section: this is the
  # first release where trivy-scan ever actually completed (the prior two
  # releases each broke on unrelated CI bugs before reaching a real scan),
  # and it surfaced ~70 CRITICAL/HIGH findings entirely inside the Debian
  # package closure that `playwright install --with-deps chromium` pulls in
  # (perl, xvfb/xserver-common, libglib2.0, libcurl3-gnutls, util-linux) -
  # none of it this project's own code, and sync/'s HTTP API is
  # Docker-network-only per SECURITY.md, never internet-exposed. Findings
  # still upload to the Security tab either way, so they stay visible - this
  # only stops them from blocking every future release until they're
  # properly triaged (would need testing whether Playwright's actual
  # headless Chromium launch survives trimming that dependency closure,
  # which needs real TR credentials to verify and wasn't safe to rush).
  trivy-scan:
    name: Trivy image scan (${{ matrix.image }})
    if: github.event_name == 'release'
    needs: [merge-app, merge-sync]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [app, sync]
    steps:
      # GHCR image references must be all-lowercase - docker/metadata-action
      # already lowercases automatically for the tag that got pushed by
      # build-app/build-sync above, but a raw ${{ github.repository }}
      # interpolation does not, and this repo's actual GitHub owner login is
      # "LoicSERRE" (capitalized). Trivy's reference parser rejects the
      # uppercase outright ("could not parse reference") before it can even
      # pull the image - this broke v1.4.5's deploy the same way v1.4.4's
      # trivy-action tag typo did: images built and pushed fine, notify-deploy
      # never fired.
      - name: Lowercase repository path
        id: repo
        run: echo "path=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      # Scans by the exact digest build-app/build-sync just pushed, not the
      # mutable `:latest` tag - v1.4.7's first two attempts each failed
      # trivy-scan(app) with 0 uploaded SARIF results despite exit code 1,
      # yet the same image scanned cleanly (0 findings, confirmed 3
      # independent ways) minutes later. GHCR's `:latest` tag pointer can lag
      # briefly behind the manifest it was just repointed to; pulling by
      # digest is immune to that since a digest resolves to exactly one
      # immutable manifest, never a moving pointer.
      # limit-severities-for-sarif: true is the actual fix behind everything
      # that looked like flakiness across v1.4.7-v1.4.10 (the digest fix and
      # the 410MB cache fix earlier were both real, separate bugs, but
      # neither was this). trivy-action's SARIF format builds its report
      # "with all severities" by default, ignoring the `severity:` input
      # entirely for what gets included and what triggers exit-code - a
      # CRITICAL/HIGH-only policy silently became "any severity, any time".
      # Root-caused via a one-off debug step (since removed) that dumped the
      # raw SARIF: it contained a real but MEDIUM-severity finding
      # (GHSA-r292-9mhp-454m, a DoS in a `tar` version vendored *inside*
      # corepack's own cached pnpm single-executable build, not this
      # project's dependency tree - see the note on corepack's cache in
      # Dockerfile) that a CRITICAL/HIGH-only gate was never meant to catch.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.repo.outputs.path }}/${{ matrix.image }}@${{ matrix.image == 'app' && needs.merge-app.outputs.digest || needs.merge-sync.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: ${{ matrix.image == 'app' && '1' || '0' }}
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.image }}

  notify-deploy:
    name: Notify private deploy repo
    if: github.event_name == 'release'
    needs: [merge-app, merge-sync, trivy-scan]
    runs-on: ubuntu-latest
    # This job never touches GITHUB_TOKEN - it authenticates to the private
    # repo via the DEPLOY_DISPATCH_TOKEN secret instead - so it needs none of
    # the default token's permissions. Explicit {} instead of leaving this
    # unset (which would inherit the repo/org default, often broader than
    # needed) is what CodeQL's actions/missing-workflow-permissions check
    # flags without it.
    permissions: {}
    steps:
      # Tells LoicSERRE/Finalibaba's deploy.yml to pull the images just
      # published above and redeploy - requires a PAT with permission to
      # dispatch workflows on that repo, stored here as DEPLOY_DISPATCH_TOKEN
      # (GITHUB_TOKEN can't reach across repos). Fires only after both images
      # are confirmed pushed, so the private deploy never pulls a half-built
      # release.
      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          repository: LoicSERRE/Finalibaba
          event-type: image-published
          client-payload: '{"release": "${{ github.event.release.tag_name }}"}'

  # PR-only counterparts to build-app/trivy-scan above - build locally
  # (push: false, load: true instead of push: true, single-platform since
  # buildx can't `load` a multi-platform result) and scan that local image.
  # Deliberately separate jobs, not a conditional branch inside build-app/
  # trivy-scan themselves, so this can never accidentally change what
  # happens on a real release - those jobs are untouched other than the
  # `if: github.event_name == 'release'` guard above.
  validate-docker-app:
    name: Validate app image builds (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: finalibaba-app:pr-validate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Informational only here (exit-code: 0) - a pre-existing base-image
      # CVE unrelated to this PR shouldn't block merge, and the real gate is
      # trivy-scan above on release. The point of running it at all on a PR
      # is to catch a broken action reference (exactly what slipped through
      # to v1.4.4 - aquasecurity/trivy-action pinned to a tag that doesn't
      # exist) before it ever reaches a release, not to enforce CVE policy.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finalibaba-app:pr-validate
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

  validate-docker-sync:
    name: Validate sync image builds (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./sync
          platforms: linux/amd64
          push: false
          load: true
          tags: finalibaba-sync:pr-validate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finalibaba-sync:pr-validate
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0
