name: Publish Docker images

on:
  release:
    types: [published]
  # Validates changes to this file and the two Dockerfiles before they ever
  # reach a release - added after v1.4.4's release pipeline built and pushed
  # both images successfully, then silently never deployed because
  # aquasecurity/trivy-action was pinned to a tag (`0.36.0`) that doesn't
  # exist (the real tag is `v0.36.0`). No PR check exercised that line -
  # ci.yml never touches Docker at all, and this file only ran on `release`.
  # The validate-docker-* jobs below reuse the exact same actions
  # (docker/build-push-action, aquasecurity/trivy-action) so a broken action
  # reference or a Dockerfile that fails to build now fails on the PR,
  # instead of silently succeeding at build-app/build-sync and only
  # surfacing at trivy-scan on release day - by which point the images are
  # already sitting in GHCR with nothing having reached prod/demo.
  pull_request:
    paths:
      - ".github/workflows/docker.yml"
      - "Dockerfile"
      - "sync/Dockerfile"

env:
  REGISTRY: ghcr.io

jobs:
  # Publishing an image is not gated on ci.yml having passed - that workflow
  # only runs on push/PR to main, and a release can be published from any
  # commit regardless of what CI said about it. This job re-runs the tests
  # here, as part of the actual publish path, so build-app/build-sync below
  # (and therefore notify-deploy, which only runs after both) are hard-blocked
  # if a test fails - no release ever reaches the private deploy pipeline
  # without a green test run against that exact commit.
  test:
    name: Unit tests
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm test

  # Same reasoning as `test` above, applied to the sync/ image specifically -
  # build-sync used to depend only on the JS test suite, so a broken Python
  # sync/ commit could still publish a new sync image with nothing to stop it.
  python-check:
    name: Python lint, tests & audit (sync service)
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.0
      - run: ruff check sync/
      - run: pip install pip-audit
      - run: pip-audit -r sync/requirements.txt
      - run: pip install -r sync/requirements.txt -r sync/requirements-dev.txt
      - run: cd sync && python -m pytest

  build-app:
    name: Build & push app image
    if: github.event_name == 'release'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Exposes the exact digest just pushed so trivy-scan can pull it by
    # digest instead of the mutable `:latest` tag - see the digest note on
    # build-push-action below for why.
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/app
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-sync:
    name: Build & push sync image
    if: github.event_name == 'release'
    needs: [test, python-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/sync
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ./sync
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Scans the images actually published above (registry pull, not a rebuild)
  # for OS-package-level CVEs - npm audit/pip-audit only ever see what's
  # declared in package.json/requirements.txt, never what's baked into the
  # final image's base layer (node:22-alpine, python:3.14-slim + apk/apt
  # packages). Findings go to the Security tab alongside CodeQL; a
  # CRITICAL/HIGH finding on the app image also blocks notify-deploy below,
  # so an unnoticed regression there can't auto-deploy to prod even though
  # the image itself is already sitting in GHCR by this point.
  #
  # sync is scanned non-blocking (exit-code 0) - see the "known accepted
  # risk" note in CLAUDE.md's Backup & restore / Docker section: this is the
  # first release where trivy-scan ever actually completed (the prior two
  # releases each broke on unrelated CI bugs before reaching a real scan),
  # and it surfaced ~70 CRITICAL/HIGH findings entirely inside the Debian
  # package closure that `playwright install --with-deps chromium` pulls in
  # (perl, xvfb/xserver-common, libglib2.0, libcurl3-gnutls, util-linux) -
  # none of it this project's own code, and sync/'s HTTP API is
  # Docker-network-only per SECURITY.md, never internet-exposed. Findings
  # still upload to the Security tab either way, so they stay visible - this
  # only stops them from blocking every future release until they're
  # properly triaged (would need testing whether Playwright's actual
  # headless Chromium launch survives trimming that dependency closure,
  # which needs real TR credentials to verify and wasn't safe to rush).
  trivy-scan:
    name: Trivy image scan (${{ matrix.image }})
    if: github.event_name == 'release'
    needs: [build-app, build-sync]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [app, sync]
    steps:
      # GHCR image references must be all-lowercase - docker/metadata-action
      # already lowercases automatically for the tag that got pushed by
      # build-app/build-sync above, but a raw ${{ github.repository }}
      # interpolation does not, and this repo's actual GitHub owner login is
      # "LoicSERRE" (capitalized). Trivy's reference parser rejects the
      # uppercase outright ("could not parse reference") before it can even
      # pull the image - this broke v1.4.5's deploy the same way v1.4.4's
      # trivy-action tag typo did: images built and pushed fine, notify-deploy
      # never fired.
      - name: Lowercase repository path
        id: repo
        run: echo "path=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      # Scans by the exact digest build-app/build-sync just pushed, not the
      # mutable `:latest` tag - v1.4.7's first two attempts each failed
      # trivy-scan(app) with 0 uploaded SARIF results despite exit code 1,
      # yet the same image scanned cleanly (0 findings, confirmed 3
      # independent ways) minutes later. GHCR's `:latest` tag pointer can lag
      # briefly behind the manifest it was just repointed to; pulling by
      # digest is immune to that since a digest resolves to exactly one
      # immutable manifest, never a moving pointer.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.repo.outputs.path }}/${{ matrix.image }}@${{ matrix.image == 'app' && needs.build-app.outputs.digest || needs.build-sync.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: ${{ matrix.image == 'app' && '1' || '0' }}
      - uses: github/codeql-action/upload-sarif@v4.37.3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.image }}

  notify-deploy:
    name: Notify private deploy repo
    if: github.event_name == 'release'
    needs: [build-app, build-sync, trivy-scan]
    runs-on: ubuntu-latest
    # This job never touches GITHUB_TOKEN - it authenticates to the private
    # repo via the DEPLOY_DISPATCH_TOKEN secret instead - so it needs none of
    # the default token's permissions. Explicit {} instead of leaving this
    # unset (which would inherit the repo/org default, often broader than
    # needed) is what CodeQL's actions/missing-workflow-permissions check
    # flags without it.
    permissions: {}
    steps:
      # Tells LoicSERRE/Finalibaba's deploy.yml to pull the images just
      # published above and redeploy - requires a PAT with permission to
      # dispatch workflows on that repo, stored here as DEPLOY_DISPATCH_TOKEN
      # (GITHUB_TOKEN can't reach across repos). Fires only after both images
      # are confirmed pushed, so the private deploy never pulls a half-built
      # release.
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          repository: LoicSERRE/Finalibaba
          event-type: image-published
          client-payload: '{"release": "${{ github.event.release.tag_name }}"}'

  # PR-only counterparts to build-app/trivy-scan above - build locally
  # (push: false, load: true instead of push: true, single-platform since
  # buildx can't `load` a multi-platform result) and scan that local image.
  # Deliberately separate jobs, not a conditional branch inside build-app/
  # trivy-scan themselves, so this can never accidentally change what
  # happens on a real release - those jobs are untouched other than the
  # `if: github.event_name == 'release'` guard above.
  validate-docker-app:
    name: Validate app image builds (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: finalibaba-app:pr-validate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Informational only here (exit-code: 0) - a pre-existing base-image
      # CVE unrelated to this PR shouldn't block merge, and the real gate is
      # trivy-scan above on release. The point of running it at all on a PR
      # is to catch a broken action reference (exactly what slipped through
      # to v1.4.4 - aquasecurity/trivy-action pinned to a tag that doesn't
      # exist) before it ever reaches a release, not to enforce CVE policy.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: finalibaba-app:pr-validate
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

  validate-docker-sync:
    name: Validate sync image builds (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: ./sync
          platforms: linux/amd64
          push: false
          load: true
          tags: finalibaba-sync:pr-validate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: finalibaba-sync:pr-validate
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0
