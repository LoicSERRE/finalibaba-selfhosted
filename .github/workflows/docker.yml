name: Publish Docker images

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  # Publishing an image is not gated on ci.yml having passed - that workflow
  # only runs on push/PR to main, and a release can be published from any
  # commit regardless of what CI said about it. This job re-runs the tests
  # here, as part of the actual publish path, so build-app/build-sync below
  # (and therefore notify-deploy, which only runs after both) are hard-blocked
  # if a test fails - no release ever reaches the private deploy pipeline
  # without a green test run against that exact commit.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  build-app:
    name: Build & push app image
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/app
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-sync:
    name: Build & push sync image
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/sync
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./sync
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-deploy:
    name: Notify private deploy repo
    needs: [build-app, build-sync]
    runs-on: ubuntu-latest
    # This job never touches GITHUB_TOKEN - it authenticates to the private
    # repo via the DEPLOY_DISPATCH_TOKEN secret instead - so it needs none of
    # the default token's permissions. Explicit {} instead of leaving this
    # unset (which would inherit the repo/org default, often broader than
    # needed) is what CodeQL's actions/missing-workflow-permissions check
    # flags without it.
    permissions: {}
    steps:
      # Tells LoicSERRE/Finalibaba's deploy.yml to pull the images just
      # published above and redeploy - requires a PAT with permission to
      # dispatch workflows on that repo, stored here as DEPLOY_DISPATCH_TOKEN
      # (GITHUB_TOKEN can't reach across repos). Fires only after both images
      # are confirmed pushed, so the private deploy never pulls a half-built
      # release.
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          repository: LoicSERRE/Finalibaba
          event-type: image-published
          client-payload: '{"release": "${{ github.event.release.tag_name }}"}'
