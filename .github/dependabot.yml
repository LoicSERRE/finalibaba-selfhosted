version: 2
updates:
  # Next.js app (pnpm-lock.yaml is auto-detected under the "npm" ecosystem -
  # Dependabot has supported pnpm lockfiles natively for a while).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # A newly-published package version is a real (if rare) supply-chain
    # risk window - a compromised maintainer account can publish a
    # malicious version that's still "the latest" for a few days before
    # anyone notices. 7 days gives that window a chance to close before
    # Dependabot proposes it here.
    cooldown:
      default-days: 7
    groups:
      # @simplewebauthn/server and /browser share their request-option types
      # across the network boundary, so a major that moves one and not the
      # other cannot compile: the server builds a
      # PublicKeyCredentialCreationOptionsJSON from v14 and the browser
      # expects v13's, which are structurally different types with the same
      # name. Dependabot opened them as two separate major PRs and CI failed
      # on both, correctly - neither is mergeable alone, and both together
      # would have been fine. Grouped by name so they can only ever move
      # together; `update-types` is left out deliberately, since it is the
      # MAJOR bumps that need this most.
      simplewebauthn:
        patterns:
          - "@simplewebauthn/*"
      # Patch/minor bumps across a lockfile this size happen constantly and
      # rarely need individual review - group them into one PR per week.
      # Majors (the ones actually worth reading a changelog for) stay
      # ungrouped, one PR each, unless a group above says otherwise.
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10

  # sync/ Python service
  - package-ecosystem: "pip"
    directory: "/sync"
    schedule:
      interval: "weekly"
    # See the npm block's cooldown comment above for why.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # pytr is intentionally pinned to a specific commit (see the comment in
    # sync/requirements.txt) because the latest PyPI-published tag is stale
    # relative to a TR API migration this project depends on - Dependabot
    # can't safely auto-bump a git-commit pin the way it does version
    # ranges, so leave it for a deliberate manual bump instead.
    ignore:
      - dependency-name: "pytr"

  # Both Dockerfiles - base image tags (node:22-alpine, python:3.12-slim)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # See the npm block's cooldown comment above for why.
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/sync"
    schedule:
      interval: "weekly"
    # See the npm block's cooldown comment above for why.
    cooldown:
      default-days: 7

  # Reusable workflow/action versions in .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # See the npm block's cooldown comment above for why.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
