# Local, on-demand SonarQube analysis only - run via a local scan.sh script
# that drives a SonarQube + scanner Docker Compose stack (not wired into
# CI - no server to host for it there). Auto-detected by sonar-scanner from
# the project root, no -D flags needed on the scan.sh command line for
# these beyond -Dsonar.sources=. itself.

sonar.projectKey=finalibaba-selfhosted
sonar.sourceEncoding=UTF-8

# Matches sync/Dockerfile's `FROM python:3.14-slim` - without this,
# SonarPython analyzes sync/ as compatible with every Python 3.x version,
# which is more conservative (and noisier) than it needs to be.
sonar.python.version=3.14

# Test files for both languages - sync/tests/ (pytest.ini's testpaths) and
# __tests__/ (vitest). Originally only sync/tests was listed here on the
# assumption that SonarJS auto-detects __tests__/**/*.test.ts as test code
# by naming convention without needing to be told - that assumption was
# wrong: setting sonar.tests to ANY explicit value apparently replaces
# whatever implicit multi-language default was in effect project-wide, not
# just adds a Python-specific path. Confirmed the hard way: the very next
# scan after adding sync/tests alone suddenly ran full production-code
# rules against every __tests__/*.test.ts file (157 new S7749 "numeric
# literal grouping" findings alone, all on intentional euros_cents-style
# BigInt fixtures like BigInt(1500_00)) and coverage cratered (test files
# themselves report 0% self-coverage, and got counted into lines_to_cover
# for the first time). Both paths must be listed explicitly together.
sonar.tests=sync/tests,__tests__

# Coverage was showing 0% because no report was ever fed to SonarQube (not
# because coverage is actually zero - see __tests__/**). vitest.config.ts's
# coverage.reporter now includes "lcov" specifically for this. Coverage
# must be generated before each scan: `pnpm run test:coverage` (not plain
# `pnpm test`, which skips instrumentation) - scan.sh doesn't run tests
# itself, this is a local prerequisite step.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Coverage-gate scope matches CLAUDE.md's own "Known, accepted coverage
# gaps" paragraph exactly - not a new decision, just making the SonarQube
# gate consistent with a testing boundary this project already documented
# and decided on before this file existed:
#   - lib/actions/* (Server Actions - every DB mutation) and
#     lib/services/gocardless.ts: zero tests, would need Prisma mocking or
#     a real test DB, neither exists yet.
#   - app/** and components/**: no component-rendering tests (no
#     jest-dom/RTL/Playwright as committed deps) - components are
#     deliberately kept as thin wrappers around the tested lib/ functions
#     (the "God Component extraction pattern" under Architecture), so the
#     logic worth covering already IS covered, just one layer down.
#   - sync/*.py except the pure functions __tests__ extracts from
#     sync_tr.py: sync_lcl.py/sync_woob.py/db.py/main.py/setup_*.py are
#     untested (would need mocking woob/pytr's own external API calls).
#   - lib/db/prisma.ts: a singleton client wiring file, nothing to unit test.
# Everything NOT listed here (lib/domain/**, lib/utils/**, lib/services/**
# except gocardless.ts, lib/auth.ts) is exactly what __tests__/** already
# covers - see the "Development commands" section of CLAUDE.md.
sonar.coverage.exclusions=**/lib/actions/**,\
  **/lib/services/gocardless.ts,\
  **/lib/db/**,\
  **/app/**,\
  **/components/**,\
  **/sync/sync_lcl.py,\
  **/sync/sync_woob.py,\
  **/sync/sync_tr.py,\
  **/sync/db.py,\
  **/sync/main.py,\
  **/sync/setup_lcl.py,\
  **/sync/setup_tr.py

# Same directories .gitignore already excludes from version control, plus
# a couple SonarQube-specific ones (.scannerwork is the scanner's own
# working directory if it ever ends up inside the mounted repo instead of
# /tmp). Without this, the scanner was walking node_modules'
# 100k+ files (2.1GB) over the WSL2<->Windows-drive bind mount before
# analyzing a single real source file - minutes of "Preprocessed 0 files"
# with no indication anything was actually happening.
#
# .ruff_cache/** (root and sync/) and *.ico were added after a scan
# reported "problems with file encoding in the source code": ruff's cache
# files are gzip-compressed binaries (self-gitignoring via their own
# .ruff_cache/.gitignore, so `sonar.exclusions` is the only place that
# actually excludes them from SonarQube's filesystem walk) and
# app/favicon.ico is a binary icon - neither is UTF-8 text, and neither is
# source code to analyze in the first place.
#
# sync/tests/** and __tests__/** must be excluded here too, on top of
# being declared via sonar.tests above - without this, the same files get
# indexed as both main source AND test source (sonar.sources defaults to
# the whole base dir, which already includes both), and the scanner
# hard-fails with "File ... can't be indexed twice" instead of just
# picking one.
sonar.exclusions=**/node_modules/**,\
  **/.next/**,\
  **/.git/**,\
  **/app/generated/**,\
  **/coverage/**,\
  **/backups/**,\
  **/__pycache__/**,\
  **/.scannerwork/**,\
  **/dist/**,\
  **/build/**,\
  **/.ruff_cache/**,\
  **/*.ico,\
  **/sync/tests/**,\
  **/__tests__/**,\
  **/.venv/**,\
  **/venv/**

# Rule-scoped false-positive suppressions found during the full remediation
# pass (see git history around this file for the rest of that pass - most
# findings were fixed for real, these are the exceptions). Docker findings
# (e3/e4) are suppressed here rather than via an inline `# NOSONAR` comment
# in the Dockerfile itself - confirmed by testing that SonarQube's docker
# analyzer doesn't honor inline NOSONAR the way the typescript/python
# analyzers do (a `# NOSONAR` trailing the FROM line was re-flagged
# unchanged on the next scan).

sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10

# S3358 (nested ternary): triaged finding-by-finding - every real bug (plain
# .ts files, ~7 of them) was fixed by converting to if/else. The remaining
# ~36 findings are all in .tsx files and are the idiomatic React
# `cond ? <A/> : <B/> : <C/>`-style conditional-rendering pattern nested
# inside JSX - readable in context, not the "genuinely confusing nested
# ternary" this rule is meant to catch. eslint.config.mjs already turns this
# rule off repo-wide for the same reason (sonarjs/no-nested-conditional);
# this keeps SonarQube's stricter default from re-litigating that call only
# for .tsx.
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S3358
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.tsx

# S7778 (combine consecutive array.push() calls into one): the 3
# export-*-button.tsx components build a Markdown report line-by-line via
# many conditionally-guarded lines.push(...) calls (one per report section) -
# mechanically merging them into single multi-arg push() calls would not
# improve readability (the whole point is one line per Markdown line) and
# risks introducing an ordering mistake for no real benefit.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S7778
sonar.issue.ignore.multicriteria.e2.resourceKey=**/components/shared/export-*.tsx

# docker:S6471 (runs as root) on sync/Dockerfile: the woob/pytr session state
# is a named Docker volume mounted at a root-home path (/root/.config/woob,
# /root/.pytr); every already-deployed self-hosted instance's existing
# volume data is owned by root there already. Switching to a non-root user
# would need a one-time ownership migration for already-running deployments -
# out of scope for a lint-driven cleanup pass, deliberate follow-up. (The
# main app's Dockerfile *was* switched to a non-root user for real - see
# its `USER node` - this exemption is sync/Dockerfile only.)
sonar.issue.ignore.multicriteria.e3.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e3.resourceKey=**/sync/Dockerfile

# docker:S6470 (recursive COPY may add sensitive data) on sync/Dockerfile's
# `COPY . .`: sync/.dockerignore already excludes .env/.env.local/.git/
# .ruff_cache (see that file for the full list and the CRITICAL vuln it
# fixed) - the residual risk this rule is warning about is already
# addressed there; the rule itself can't see .dockerignore content to know
# that.
sonar.issue.ignore.multicriteria.e4.ruleKey=docker:S6470
sonar.issue.ignore.multicriteria.e4.resourceKey=**/sync/Dockerfile

# typescript:S6819 (prefer <progress>/<output> over role="progressbar"/
# "status"): suppressed here rather than relying only on the inline
# `{/* ... */}` JSX comments already sitting above each flagged <div> in
# these 6 files (kept for human readers) - a trailing `// NOSONAR` on the
# exact reported line isn't reliably placeable here: a bare `<div //
# NOSONAR` with no attribute yet on that line breaks Turbopack's JSX parser,
# and moving the comment before the <div> only works when that <div> is a
# genuine JSX child among siblings (needs `{/* */}`) vs the sole expression
# inside a `cond && (...)` paren (needs a plain `//`) - two incompatible
# JSX-comment contexts across these 6 files, confirmed the hard way via a
# real build. Config-based suppression sidesteps needing to get every one
# of those exactly right. Justification: native <progress> can't express
# the threshold-based color-coded fill or rounded-full track these 6
# components use without vendor-prefixed ::-webkit-progress-value/
# ::-moz-progress-bar pseudo-elements (inconsistent cross-browser); full
# ARIA (aria-valuenow/min/max/label) is already present on every one, so
# this is a style preference, not an accessibility gap. The 2 role="status"
# findings in the same original rule sweep (settings/page.tsx,
# connect-open-banking-dialog.tsx) were fixed for real (<output>), not
# suppressed - only the 6 progress-bar divs below are exempted.
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.e5.resourceKey=**/components/account-detail/automobile-section.tsx
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.e6.resourceKey=**/components/account-detail/loan-section.tsx
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.e7.resourceKey=**/components/account-detail/real-estate-section.tsx
sonar.issue.ignore.multicriteria.e8.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.e8.resourceKey=**/components/analytics/allocation-radar-section.tsx
sonar.issue.ignore.multicriteria.e9.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.e9.resourceKey=**/components/analytics/goal-and-passive-income.tsx
sonar.issue.ignore.multicriteria.e10.ruleKey=typescript:S6819
# Moved from app/budgets/page.tsx into its own component when that page's
# per-category card markup was extracted - same progress bar, same
# justification above, just relocated.
sonar.issue.ignore.multicriteria.e10.resourceKey=**/components/budgets/category-card.tsx
