# pnpm blocks a dependency's install/postinstall scripts by default unless
# explicitly allowed here - a real security improvement over npm's "run
# everything" default, but it means legitimate native-binary builds need an
# explicit yes. All 6 below are well-known, expected parts of this stack
# (Next.js's SWC compiler, Prisma's engine binaries, esbuild, file-watching)
# with no native-build alternative - blocking any of them would break the
# toolchain, not add safety.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  unrs-resolver: true
# pnpm 11 moved settings that used to live under package.json's "pnpm" key
# (npm's "overrides" field too) here - see https://pnpm.io/settings.
# Not an actual multi-package workspace; this file just holds config.
overrides:
  uuid: ">=11.1.1"
  postcss: ">=8.5.23"
  # GHSA-2v37-7h3g-55p8 - a custom nanoid generator can loop indefinitely
  # when called with size 0. Pulled in transitively as postcss's own
  # dependency (next>postcss>nanoid, and again via next-auth/next-intl's
  # own next re-exports) - postcss is a real, shipped part of Next's build
  # pipeline, not one of the never-invoked-subcommand exemptions below.
  nanoid: ">=3.3.17"
  sharp: ">=0.35.0"
  js-yaml: ">=4.3.0"
  find-my-way: ">=9.7.0"
  valibot: ">=1.4.2"
  # GHSA-ggr8-5vv4-36mx - stack exhaustion merging a crafted recursive
  # (self-referential) object graph. Unlike find-my-way/valibot above, this
  # one IS on a live code path: @prisma/config uses deepmerge-ts (exact-
  # pinned at 7.1.5 in its own package.json) to merge this project's own
  # prisma.config.ts against c12's defaults, on every `prisma generate`/
  # `prisma migrate deploy` - including the Dockerfile CMD that runs on
  # every container start. But the input to that merge is never
  # attacker-controlled: it's this repo's own checked-in config file plus
  # Prisma's internal defaults, never JSON parsed from a request body (and
  # JSON itself can't express the circular self-reference the PoC needs -
  # only a literal `obj.self = obj` in JS can). Overridden rather than left
  # as a documented-only exemption because v8's breaking changes (deep Map-
  # value merging, some renamed type exports) don't touch the plain
  # `deepmerge(a, b)` function signature @prisma/config actually calls -
  # confirmed empirically: `prisma generate` and `prisma migrate deploy`
  # both still succeed against this override, see the commit this landed in.
  deepmerge-ts: ">=8.0.0"
  # GHSA-7p8r-x3mc-p8w7 - host confusion via backslash authority introducer.
  # Same "reachable only through @prisma/dev's never-invoked embedded-Postgres
  # subcommand" story as find-my-way/valibot above: pulled in via
  # prisma>@prisma/dev>@prisma/streams-local>ajv>fast-uri, a chain that only
  # matters if `prisma dev` is ever run, which this project never does - but
  # prisma is a non-dev `dependencies` entry (Dockerfile's CMD runs `prisma
  # migrate deploy`), so it's still installed by the `--prod` install and
  # still in scope for CI's `pnpm audit --prod --audit-level=high` gate.
  fast-uri: ">=3.1.5"
  # GHSA-3f6p-5ww8-9rcr - a malicious/compromised MySQL server can downgrade
  # the auth plugin to mysql_clear_password and read the connecting client's
  # plaintext credentials. Pulled in transitively via prisma>mysql2 and
  # @prisma/client>prisma>mysql2 - Prisma bundles driver support for every
  # database it supports, but this project only ever connects to PostgreSQL
  # (prisma/schema.prisma's datasource is `provider = "postgresql"`, and
  # lib/db/prisma.ts constructs its client via @prisma/adapter-pg, never
  # mysql2 or any Prisma-internal MySQL driver path). Same "installed as a
  # non-dev `dependencies` entry, never actually invoked" shape as
  # find-my-way/valibot/fast-uri above - this project has no MySQL
  # datasource for the driver to ever connect through.
  mysql2: ">=3.22.0"
  eslint-plugin-react-hooks: "7.0.1"
  # pnpm's override selector only supports one level of "parent>dep" -
  # 3-segment chains like npm's nested "eslint > minimatch > brace-expansion"
  # override aren't valid syntax here. Scoping by minimatch's OWN version
  # instead of by which package imported it achieves the same goal more
  # directly: minimatch@10.x (pulled in by @typescript-eslint/typescript-estree)
  # can safely take brace-expansion 5.x, while minimatch@3.x (eslint's own
  # vendored copy, old API) needs to stay on the 1.x line - see the npm
  # override history this replaced for the full GHSA-mh99-v99m-4gvg context.
  # Bounded to each package's own major line, not open-ended - an unbounded
  # ">=1.1.16" is numerically satisfied by 5.0.9 too, so the two ranges
  # overlapped and pnpm resolved both scopes to the same (wrong, for
  # minimatch@3.1.5's old API) version instead of respecting the parent scope.
  #
  # IMPORTANT correction (2026-07): GHSA-mh99-v99m-4gvg was later updated with
  # an unrelated new DoS class (CVE-2026-14257, unbounded expand() output
  # size) that's patched ONLY on the 5.x line (5.0.8+) - there is no patched
  # 1.x release and there will never be one (1.1.18, already the max we
  # allow here, is the last 1.x version npm ever published). So the
  # minimatch@3.1.5 line below does NOT actually carry a fix for that CVE -
  # it only avoids the unrelated "expand is not a function" API-incompatibility
  # crash described above. Accepted as-is: this path only ever runs at lint
  # time (pnpm run lint / CI), never in the shipped app, and pnpm's
  # --prod --audit-level=high CI gate (see CLAUDE.md's "pnpm overrides")
  # already excludes it. The real fix is eslint 9 -> 10, which drops
  # minimatch 3.x entirely in favor of 10.x everywhere - that's a major
  # version bump so dependabot.yml will surface it as its own PR rather than
  # silently grouping it with patch/minor bumps.
  "minimatch@10.2.6>brace-expansion": ">=5.0.8 <6.0.0"
  "minimatch@3.1.5>brace-expansion": ">=1.1.16 <2.0.0"
