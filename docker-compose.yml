services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-finalibaba}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-finalibaba}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: ghcr.io/loicserre/finalibaba-selfhosted/app:latest
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finalibaba}
      NODE_ENV: production
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required - run: openssl rand -base64 32}"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_USER_NAME: ${AUTH_USER_NAME:-}
      APP_URL: ${APP_URL:-}
      GOCARDLESS_SECRET_ID: ${GOCARDLESS_SECRET_ID:-}
      GOCARDLESS_SECRET_KEY: ${GOCARDLESS_SECRET_KEY:-}
      SYNC_SERVICE_URL: http://sync:8000
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # wget is present on node:22-alpine (curl isn't) - see app/api/health/route.ts,
      # excluded from proxy.ts's auth matcher so this works even with AUTH_ENABLED=true.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  sync:
    image: ghcr.io/loicserre/finalibaba-selfhosted/sync:latest
    build: ./sync
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finalibaba}
      LCL_LOGIN: ${LCL_LOGIN:-}
      LCL_PASSWORD: ${LCL_PASSWORD:-}
      TR_PHONE: ${TR_PHONE:-}
      TR_PIN: ${TR_PIN:-}
      # Reused as the shared bearer token for the alerts-check call below,
      # not a new secret - see app/api/alerts/check/route.ts.
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required - run: openssl rand -base64 32}"
      APP_SERVICE_URL: http://app:3000
    volumes:
      - woob_session:/root/.config/woob
      - pytr_session:/root/.pytr
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # python:3.12-slim has neither curl nor wget - use the stdlib instead.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Optional - self-hosted push notifications for Settings → Alertes, instead
  # of (or in addition to) the public ntfy.sh. Not started by a plain
  # `docker compose up -d` - opt in with `docker compose --profile ntfy up -d`.
  # See README's "Self-hosted alerts" section for the one-time `ntfy user
  # add`/`ntfy token add` setup and how to point Settings at it.
  ntfy:
    image: binwiederhier/ntfy:latest
    command: serve
    profiles: ["ntfy"]
    environment:
      # deny-all + a per-user token (created once via `ntfy user add`/`ntfy
      # token add`, see README) is the whole point of self-hosting this
      # instead of using the public server - real access control, not just
      # an unguessable topic name.
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
    ports:
      - "${NTFY_PORT:-8090}:80"
    volumes:
      - ntfy_data:/var/lib/ntfy
    restart: unless-stopped

  # Optional - self-hosted outbound mail for Settings → Alertes → "Serveur
  # mail auto-hébergé", instead of Gmail/Outlook or a third-party API. Not
  # started by a plain `docker compose up -d` - opt in with
  # `docker compose --profile mail up -d`. Requires a domain you control and
  # DNS records only you can add (SPF/DKIM/DMARC) - see README's
  # "Self-hosted alerts" section before enabling, including why this often
  # doesn't work from a residential internet connection (ISP port-25
  # blocking, IP reputation) regardless of how correctly this is configured.
  #
  # MAIL_DOMAIN is intentionally NOT a required (":?") variable here, unlike
  # POSTGRES_PASSWORD/NEXTAUTH_SECRET above - Compose evaluates required-
  # variable checks for every service in the file during interpolation,
  # before profile filtering, so a ":?" here would break `docker compose up
  # -d` for every installation that never touches the mail profile at all.
  # Confirmed empirically. docker-mailserver's own startup fails loudly if
  # MAIL_DOMAIN is blank when this profile is actually used instead.
  mail:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    profiles: ["mail"]
    hostname: mail
    domainname: ${MAIL_DOMAIN:-}
    environment:
      # Outbound sending only - no IMAP/POP3/mailboxes, this project only
      # ever needs to send its own alert emails, never receive or host any.
      SMTP_ONLY: 1
      ENABLE_OPENDKIM: 1
      ENABLE_OPENDMARC: 0
      ENABLE_SPAMASSASSIN: 0
      ENABLE_CLAMAV: 0
      ONE_DIR: 1
      # SMTP_ONLY disables Dovecot entirely, which is also where Postfix's
      # SASL auth backend normally comes from - confirmed empirically that
      # authenticated submission (port 587) simply doesn't work in this
      # mode, `smtpd_sasl_auth_enable` stays "no" regardless of any user
      # created via `setup email add`. PERMIT_DOCKER trusts the Docker
      # network's own subnet instead (added to Postfix's mynetworks) - same
      # "same Docker network = trusted, no credentials" model already used
      # for app<->sync, and why alerts-section.tsx's self-hosted preset
      # points at port 25, not 587. OpenDKIM's own TrustedHosts (a separate
      # file from Postfix's mynetworks) does NOT need the same treatment -
      # confirmed it auto-detects the container's Docker network correctly
      # on its own.
      PERMIT_DOCKER: connected-networks
    volumes:
      # mail_config is the important one to never lose - it holds the
      # generated OpenDKIM keypair. Losing it means generating a new key,
      # which then no longer matches the DKIM DNS record already published.
      - mail_data:/var/mail-state
      - mail_config:/tmp/docker-mailserver
      - mail_logs:/var/log/mail
    restart: unless-stopped

volumes:
  postgres_data:
  woob_session:
  pytr_session:
  ntfy_data:
  mail_data:
  mail_config:
  mail_logs:
